<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Panel | Chat Support System</title>
    
    <!-- Tailwind CSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #11998e;
            border-radius: 10px;
        }
        
        /* Message Bubbles */
        .message-received {
            background: #f3f4f6;
            color: #1f2937;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }
        
        .message-sent {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border-radius: 18px;
            border-bottom-right-radius: 4px;
        }
        
        /* Thread Item Hover */
        .thread-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .thread-item:hover {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%);
            transform: translateX(5px);
        }
        
        .thread-item.active {
            background: linear-gradient(135deg, #e0f2e9 0%, #c8e6d9 100%);
            border-left: 4px solid #11998e;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .notification-badge {
            animation: pulse 1s infinite;
        }
        
        /* Typing Indicator */
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #11998e;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-10px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-4 max-w-7xl">
        <!-- Header -->
        <div class="fade-in">
            <div class="flex justify-between items-center mb-6 bg-white/10 backdrop-blur-lg rounded-2xl p-4 shadow-xl">
                <div>
                    <h1 class="text-2xl font-bold text-white">
                        <i class="fas fa-headset mr-2"></i>Support Panel
                    </h1>
                    <p class="text-white/80 text-sm">Manage customer conversations</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-white text-right">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-user-circle text-2xl"></i>
                            <span id="agentName" class="font-semibold">Agent</span>
                        </div>
                        <div class="flex items-center gap-3 mt-1">
                            <span id="siteName" class="text-xs text-white/80">
                                <i class="fas fa-globe mr-1"></i>Loading...
                            </span>
                            <button onclick="logout()" class="text-xs text-white/80 hover:text-white transition">
                                <i class="fas fa-sign-out-alt mr-1"></i>Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 fade-in">
            <!-- Threads List -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden h-[85vh] flex flex-col">
                <div class="bg-gradient-to-r from-teal-500 to-green-500 px-5 py-3">
                    <h2 class="text-lg font-bold text-white">
                        <i class="fas fa-comments mr-2"></i>Active Conversations
                    </h2>
                    <p class="text-white/80 text-xs mt-1" id="threadCount">0 threads</p>
                </div>
                
                <div class="flex-1 overflow-y-auto p-3 space-y-2" id="threadsList">
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p>Loading threads...</p>
                    </div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl overflow-hidden h-[85vh] flex flex-col">
                <div class="bg-gradient-to-r from-teal-500 to-green-500 px-5 py-3 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold text-white" id="chatHeaderTitle">
                            <i class="fas fa-user mr-2"></i>Select a conversation
                        </h2>
                        <p class="text-white/80 text-xs" id="chatHeaderStatus">Click on any thread to start chatting</p>
                    </div>
                    <div id="typingIndicator" class="hidden">
                        <div class="typing-indicator flex gap-1">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
                
                <!-- Messages Area -->
                <div class="flex-1 overflow-y-auto p-5 space-y-3" id="chatMessages">
                    <div class="text-center py-8 text-gray-400">
                        <i class="fas fa-inbox text-4xl mb-2"></i>
                        <p>No conversation selected</p>
                    </div>
                </div>
                
                <!-- Message Input -->
                <div class="p-4 border-t border-gray-200 bg-gray-50">
                    <div class="flex gap-3">
                        <input type="text" id="messageInput" 
                               placeholder="Type your message..." 
                               class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition"
                               disabled>
                        <button onclick="sendMessage()" 
                                id="sendButton"
                                class="bg-gradient-to-r from-teal-500 to-green-500 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                                disabled>
                            <i class="fas fa-paper-plane mr-2"></i>Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let token = localStorage.getItem('supportToken');
        let socket = null;
        let currentThreadId = null;
        let currentAgent = null;
        let currentSiteId = null;
        
        // Check authentication
        if (!token) {
            showLoginModal();
        } else {
            verifyTokenAndLoad();
        }
        
        function showLoginModal() {
            const email = prompt('📧 Support Agent Email:', '');
            const password = prompt('🔑 Password:', '');
            
            if (email && password) {
                fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.token) {
                        localStorage.setItem('supportToken', data.token);
                        localStorage.setItem('agentName', data.user.name);
                        token = data.token;
                        currentAgent = data.user;
                        document.getElementById('agentName').innerText = data.user.name;
                        initSocket();
                        loadAgentDetails();
                        loadThreads();
                    } else {
                        alert('❌ Login failed! Invalid credentials.');
                        showLoginModal();
                    }
                })
                .catch(() => {
                    alert('❌ Network error! Please try again.');
                    showLoginModal();
                });
            }
        }
        
        async function verifyTokenAndLoad() {
            try {
                // Verify token and get user info
                const res = await fetch(`${API_URL}/auth/verify`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401) {
                    localStorage.removeItem('supportToken');
                    showLoginModal();
                } else {
                    const data = await res.json();
                    currentAgent = data.user;
                    document.getElementById('agentName').innerText = currentAgent.name;
                    initSocket();
                    await loadAgentDetails();
                    loadThreads();
                }
            } catch (err) {
                console.error('Token verification failed:', err);
                showLoginModal();
            }
        }
        
        async function loadAgentDetails() {
            try {
                // Get agent's assigned site
                const res = await fetch(`${API_URL}/users/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const user = await res.json();
                    currentSiteId = user.siteId;
                    
                    // Get site details
                    const siteRes = await fetch(`${API_URL}/sites/${currentSiteId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    
                    if (siteRes.ok) {
                        const site = await siteRes.json();
                        document.getElementById('siteName').innerHTML = `<i class="fas fa-globe mr-1"></i>${site.name}`;
                    }
                }
            } catch (err) {
                console.error('Error loading agent details:', err);
            }
        }
        
        function initSocket() {
            socket = io('http://localhost:3000');
            
            socket.on('connect', () => {
                console.log('✅ Connected to chat server');
                socket.emit('support-auth', token);
                if (currentSiteId) {
                    socket.emit('join-site', currentSiteId);
                }
            });
            
            socket.on('new-thread-message', (data) => {
                if (currentThreadId === data.threadId) {
                    addMessageToChat(data.message);
                }
                loadThreads(); // Refresh thread list
            });
            
            socket.on('thread-assigned', (thread) => {
                loadThreads();
                if (currentThreadId === thread.id) {
                    loadMessages(currentThreadId);
                }
            });
            
            socket.on('typing', (data) => {
                if (data.threadId === currentThreadId && data.isTyping) {
                    document.getElementById('typingIndicator').classList.remove('hidden');
                    setTimeout(() => {
                        document.getElementById('typingIndicator').classList.add('hidden');
                    }, 2000);
                }
            });
        }
        
        async function loadThreads() {
            try {
                const res = await fetch(`${API_URL}/threads/site/${currentSiteId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const threads = await res.json();
                
                const threadsList = document.getElementById('threadsList');
                const threadCount = document.getElementById('threadCount');
                
                threadCount.innerText = `${threads.length} threads`;
                
                if (threads.length === 0) {
                    threadsList.innerHTML = `
                        <div class="text-center py-8 text-gray-500">
                            <i class="fas fa-inbox text-3xl mb-2"></i>
                            <p>No conversations yet</p>
                            <p class="text-sm">Waiting for visitors to start chatting</p>
                        </div>
                    `;
                    return;
                }
                
                threadsList.innerHTML = '';
                
                threads.forEach(thread => {
                    const isActive = currentThreadId === thread.id;
                    const statusColor = thread.status === 'open' ? 'text-green-500' : 'text-yellow-500';
                    const statusIcon = thread.status === 'open' ? 'fa-circle' : 'fa-clock';
                    
                    threadsList.innerHTML += `
                        <div class="thread-item p-3 rounded-xl ${isActive ? 'active' : 'hover:bg-gray-50'}" onclick="selectThread(${thread.id})">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2">
                                        <i class="fas fa-user-circle text-gray-400"></i>
                                        <span class="font-semibold text-gray-800">${escapeHtml(thread.visitorName || 'Guest')}</span>
                                        <i class="fas ${statusIcon} ${statusColor} text-xs"></i>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-1">
                                        <i class="fas fa-clock mr-1"></i>${new Date(thread.lastMessageAt).toLocaleString()}
                                    </p>
                                    <p class="text-sm text-gray-600 mt-1 truncate">${escapeHtml(thread.lastMessage || 'Click to view')}</p>
                                </div>
                                ${!thread.assignedTo && thread.status !== 'closed' ? 
                                    '<button onclick="event.stopPropagation(); assignThread(' + thread.id + ')" class="bg-teal-500 text-white text-xs px-2 py-1 rounded-lg hover:bg-teal-600">Pick</button>' : 
                                    thread.assignedTo === currentAgent?.id ? '<span class="bg-green-100 text-green-600 text-xs px-2 py-1 rounded-full"><i class="fas fa-check mr-1"></i>Assigned to you</span>' : 
                                    '<span class="bg-gray-100 text-gray-500 text-xs px-2 py-1 rounded-full">Assigned</span>'
                                }
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Load threads error:', err);
            }
        }
        
        async function selectThread(threadId) {
            currentThreadId = threadId;
            document.getElementById('chatHeaderTitle').innerHTML = '<i class="fas fa-comment-dots mr-2"></i>Chatting with Visitor';
            document.getElementById('chatHeaderStatus').innerHTML = '💬 Active conversation';
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            await loadMessages(threadId);
            loadThreads(); // Refresh to highlight selected thread
        }
        
        async function loadMessages(threadId) {
            try {
                const res = await fetch(`${API_URL}/threads/${threadId}/messages`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const messages = await res.json();
                
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                
                if (messages.length === 0) {
                    chatMessages.innerHTML = `
                        <div class="text-center py-8 text-gray-400">
                            <i class="fas fa-comment text-4xl mb-2"></i>
                            <p>No messages yet</p>
                            <p class="text-sm">Start the conversation!</p>
                        </div>
                    `;
                } else {
                    messages.forEach(msg => addMessageToChat(msg));
                }
                
                // Scroll to bottom
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) {
                console.error('Load messages error:', err);
            }
        }
        
        async function assignThread(threadId) {
            if (socket) {
                socket.emit('pick-thread', threadId);
                setTimeout(() => {
                    loadThreads();
                    if (currentThreadId === threadId) {
                        selectThread(threadId);
                    }
                }, 500);
            }
        }
        
        function sendMessage() {
            const message = document.getElementById('messageInput').value;
            if (!message.trim() || !currentThreadId) return;
            
            if (socket) {
                socket.emit('support-message', {
                    threadId: currentThreadId,
                    message: message,
                    supportId: currentAgent?.id
                });
                document.getElementById('messageInput').value = '';
            }
        }
        
        function addMessageToChat(msg) {
            const chatMessages = document.getElementById('chatMessages');
            const isSupport = msg.sender === 'support';
            const isCurrentUser = isSupport && msg.senderId === currentAgent?.id;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isCurrentUser ? 'justify-end' : 'justify-start'} fade-in`;
            messageDiv.innerHTML = `
                <div class="max-w-[70%] ${isCurrentUser ? 'message-sent' : 'message-received'} p-3">
                    <div class="text-sm">${escapeHtml(msg.message)}</div>
                    <div class="text-xs mt-1 opacity-70 ${isCurrentUser ? 'text-white/80' : 'text-gray-500'}">
                        ${new Date(msg.createdAt).toLocaleTimeString()}
                    </div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            localStorage.removeItem('supportToken');
            localStorage.removeItem('agentName');
            if (socket) socket.disconnect();
            location.reload();
        }
        
        // Handle enter key
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('messageInput') === document.activeElement) {
                sendMessage();
            }
        });
    </script>
</body>
</html>
