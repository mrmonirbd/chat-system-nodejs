<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Panel | Chat Support System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #11998e; border-radius: 10px; }
        .message-received { background: #f3f4f6; color: #1f2937; border-radius: 18px; border-bottom-left-radius: 4px; }
        .message-sent { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border-radius: 18px; border-bottom-right-radius: 4px; }
        .thread-item { transition: all 0.3s ease; cursor: pointer; }
        .thread-item:hover { background: linear-gradient(135deg, #f5f5f5 0%, #e8f5e9 100%); transform: translateX(5px); }
        .thread-item.active { background: linear-gradient(135deg, #e0f2e9 0%, #c8e6d9 100%); border-left: 4px solid #11998e; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        .notification-badge { background: #ef4444; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; margin-left: 8px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
        
        /* Thread update indicator */
        .thread-updating {
            animation: threadPulse 0.5s ease-out;
        }
        @keyframes threadPulse {
            0% { background: #ffffff; }
            50% { background: #bae6fd; }
            100% { background: #ffffff; }
        }
        .thread-badge-new {
            background: #3b82f6;
            color: white;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 10px;
            margin-left: 8px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .last-msg-updated {
            font-weight: bold;
            color: #3b82f6 !important;
        }
        .quick-reply-chip {
            background: white;
            border: 1px solid #d1d5db;
            color: #374151;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 12px;
            transition: all 0.2s ease;
            white-space: normal;
            overflow-wrap: anywhere;
            text-align: left;
            max-width: 220px;
            line-height: 1.3;
        }
        .quick-reply-chip:hover:not(:disabled) {
            border-color: #14b8a6;
            color: #0f766e;
            background: #f0fdfa;
        }
        .quick-reply-chip:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .quick-replies-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            overflow: visible;
            padding: 0 12px 8px 12px;
        }
        .custom-quick-replies-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: flex-start;
            max-height: 72px;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 12px 8px 12px;
        }
        .quick-replies-label {
            padding: 0 12px 6px 12px;
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .quick-reply-settings {
            position: absolute;
            left: 0;
            bottom: 100%;
            margin-bottom: 10px;
            width: 320px;
            max-width: calc(100vw - 48px);
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.16);
            z-index: 20;
        }
        .quick-reply-tooltip {
            position: fixed;
            max-width: 320px;
            background: #111827;
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.4;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.22);
            z-index: 10000;
            pointer-events: none;
        }
        .quick-delete-confirm {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-4 max-w-7xl">
        <div class="fade-in">
            <div class="flex justify-between items-center mb-6 bg-white/10 backdrop-blur-lg rounded-2xl p-4 shadow-xl">
                <div>
                    <h1 class="text-2xl font-bold text-white"><i class="fas fa-headset mr-2"></i>Support Panel</h1>
                    <p class="text-white/80 text-sm">Manage customer conversations</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-white text-right">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-user-circle text-2xl"></i>
                            <span id="agentName" class="font-semibold">Agent</span>
                        </div>
                        <div class="flex items-center gap-3 mt-1">
                            <span id="siteName" class="text-xs text-white/80"><i class="fas fa-globe mr-1"></i>Loading...</span>
                            <button onclick="logout()" class="text-xs text-white/80 hover:text-white transition"><i class="fas fa-sign-out-alt mr-1"></i>Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 fade-in">
            <!-- Threads List -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden h-[85vh] flex flex-col">
                <div class="bg-gradient-to-r from-teal-500 to-green-500 px-5 py-3">
                    <h2 class="text-lg font-bold text-white"><i class="fas fa-comments mr-2"></i>Active Conversations</h2>
                    <p class="text-white/80 text-xs mt-1" id="threadCount">0 threads</p>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-2" id="threadsList">
                    <div class="text-center py-8 text-gray-500"><i class="fas fa-spinner fa-spin text-2xl mb-2"></i><p>Loading threads...</p></div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl overflow-hidden h-[85vh] flex flex-col">
                <div class="bg-gradient-to-r from-teal-500 to-green-500 px-5 py-3 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold text-white" id="chatHeaderTitle"><i class="fas fa-user mr-2"></i>Select a conversation</h2>
                        <p class="text-white/80 text-xs" id="chatHeaderStatus">Click on any thread to start chatting</p>
                    </div>
                    <div id="typingIndicator" class="hidden"><div class="typing-indicator flex gap-1"><span></span><span></span><span></span></div></div>
                </div>
                <div class="flex-1 overflow-y-auto p-5 space-y-3" id="chatMessages">
                    <div class="text-center py-8 text-gray-400"><i class="fas fa-inbox text-4xl mb-2"></i><p>No conversation selected</p></div>
                </div>
                <div class="p-4 border-t border-gray-200 bg-gray-50">
                    <div class="relative">
                        <div class="quick-replies-list" id="quickReplies">
                            <button type="button" class="quick-reply-chip" onclick="toggleQuickReplySettings()" data-tooltip="Manage quick replies"><i class="fas fa-cog"></i></button>
                            <button type="button" class="quick-reply-chip" data-reply="Hello! How can I help you today?" data-tooltip="Hello! How can I help you today?" onclick="insertQuickReply(this.dataset.reply)" disabled>Hello</button>
                            <button type="button" class="quick-reply-chip" data-reply="Thanks for reaching out. I am checking this for you." data-tooltip="Thanks for reaching out. I am checking this for you." onclick="insertQuickReply(this.dataset.reply)" disabled>Checking</button>
                            <button type="button" class="quick-reply-chip" data-reply="Could you please share a little more detail?" data-tooltip="Could you please share a little more detail?" onclick="insertQuickReply(this.dataset.reply)" disabled>More detail</button>
                            <button type="button" class="quick-reply-chip" data-reply="Please wait a moment while I look into this." data-tooltip="Please wait a moment while I look into this." onclick="insertQuickReply(this.dataset.reply)" disabled>Please wait</button>
                            <button type="button" class="quick-reply-chip" data-reply="This should be resolved now. Please check and let me know." data-tooltip="This should be resolved now. Please check and let me know." onclick="insertQuickReply(this.dataset.reply)" disabled>Resolved</button>
                        </div>
                        <div class="quick-replies-label">Custom replies</div>
                        <div id="customQuickReplies" class="custom-quick-replies-list"></div>
                        <div id="quickReplySettings" class="quick-reply-settings hidden p-3">
                            <div class="flex items-center justify-between gap-3 mb-3">
                                <div>
                                    <p class="text-sm font-semibold text-gray-800">Custom quick replies</p>
                                    <p class="text-xs text-gray-500">Add or remove your saved replies</p>
                                </div>
                                <button type="button" class="text-gray-400 hover:text-gray-700" onclick="toggleQuickReplySettings(false)">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <div class="flex gap-2 items-start">
                                <textarea id="customQuickReplyInput" rows="2" placeholder="Write custom quick text..." class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 resize-none"></textarea>
                                <button type="button" class="bg-teal-500 text-white rounded-lg px-3 py-2 text-sm font-semibold hover:bg-teal-600" onclick="addCustomQuickReply()">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                            <div id="customQuickReplyManager" class="mt-3 space-y-2 max-h-48 overflow-y-auto"></div>
                        </div>
                    </div>
                    <div class="flex gap-3">
                        <input type="text" id="messageInput" placeholder="Type your message..." class="flex-1 px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" disabled>
                        <button onclick="sendMessage()" id="sendButton" class="bg-gradient-to-r from-teal-500 to-green-500 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled><i class="fas fa-paper-plane mr-2"></i>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let token = localStorage.getItem('supportToken');
        let socket = null;
        let currentThreadId = null;
        let currentAgent = null;
        let currentSiteId = null;
        let typingTimeout = null;        
        let displayedMessageIds = new Set();
        let unreadCounts = {};
        let customQuickReplyItems = [];
        
        if (!token) {
            showLoginModal();
        } else {
            verifyTokenAndLoad();
        }
        setupDelayedTooltips();
        
        function showLoginModal() {
            const email = prompt('📧 Support Agent Email:', '');
            const password = prompt('🔑 Password:', '');
            if (email && password) {
                fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                .then(res => res.json())
                .then(async data => {
                    if (data.token) {
                        localStorage.setItem('supportToken', data.token);
                        localStorage.setItem('agentName', data.user.name);
                        token = data.token;
                        currentAgent = data.user;
                        currentSiteId = data.user.siteId;
                        document.getElementById('agentName').innerText = data.user.name;
                        initSocket();
                        await loadAgentDetails();
                        await loadCustomQuickReplies();
                    } else {
                        alert('Login failed!');
                        showLoginModal();
                    }
                })
                .catch(() => { alert('Network error!'); showLoginModal(); });
            }
        }
        
        async function verifyTokenAndLoad() {
            try {
                const res = await fetch(`${API_URL}/auth/verify`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                
                if (res.status === 401) {
                    localStorage.removeItem('supportToken');
                    showLoginModal();
                } else {
                    const data = await res.json();
                    currentAgent = data.user;
                    currentSiteId = currentAgent.siteId;
                    document.getElementById('agentName').innerText = currentAgent.name;
                    
                    initSocket();
                    await loadAgentDetails();
                    await loadCustomQuickReplies();
                    
                    const lastThreadId = localStorage.getItem('lastThreadId');
                    if (lastThreadId) {
                        setTimeout(() => {
                            console.log('🔄 Restoring thread after reload:', lastThreadId);
                            selectThread(parseInt(lastThreadId));
                        }, 1500);
                    }
                }
            } catch (err) { 
                console.error(err); 
                showLoginModal(); 
            }
        }
        
        async function loadAgentDetails() {
            try {
                const res = await fetch(`${API_URL}/users/me`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const user = await res.json();
                    currentSiteId = user.siteId;
                    const siteRes = await fetch(`${API_URL}/sites/${currentSiteId}`, { headers: { 'Authorization': `Bearer ${token}` } });
                    if (siteRes.ok) {
                        const site = await siteRes.json();
                        document.getElementById('siteName').innerHTML = `<i class="fas fa-globe mr-1"></i>${site.name}`;
                    }
                    loadThreads();
                }
            } catch (err) { console.error(err); }
        }
        

function initSocket() {
    socket = io('http://localhost:3000');

    socket.on('connect', () => {
        console.log('✅ Socket connected, ID:', socket.id);

        socket.emit('support-auth', token);

        if (currentSiteId) {
            socket.emit('join-site', currentSiteId);
            console.log('✅ Joined site room:', currentSiteId);
        } else {
            console.warn('⚠️ currentSiteId not found');
        }

        const lastThreadId = localStorage.getItem('lastThreadId');

        if (lastThreadId && currentAgent) {
            socket.emit('join-thread', lastThreadId, currentAgent.id);
            console.log('✅ Re-joined thread:', lastThreadId);
        }
    });

    socket.on('new-message', (msg) => {
        console.log('🔴🔴🔴 NEW MESSAGE:', msg);

        if (displayedMessageIds.has(msg.id)) return;
        displayedMessageIds.add(msg.id);

        loadThreads();

        if (msg.sender === 'visitor') {
            playNotificationSound();

            if (currentThreadId !== msg.threadId) {
                unreadCounts[msg.threadId] = (unreadCounts[msg.threadId] || 0) + 1;
            }

            if (currentThreadId !== msg.threadId && Notification.permission === 'granted') {
                new Notification('New Message', {
                    body: msg.message.substring(0, 50)
                });
            }
        }

        if (currentThreadId === msg.threadId) {
            addMessageToChat(msg);
        }
    });

    socket.on('new-thread-message', (data) => {
        console.log('📩 New thread message:', data);
        loadThreads();
    });

    socket.on('new-thread', (thread) => {
        console.log('🆕 New thread:', thread);
        loadThreads();
    });

    socket.on('thread-updated', (thread) => {
        console.log('🔄 Thread updated:', thread);
        loadThreads();
    });

    socket.on('visitor-typing', (data) => {
        if (data.isTyping && currentThreadId) {
            document.getElementById('chatHeaderStatus').innerHTML = '✏️ Visitor is typing...';
        } else {
            document.getElementById('chatHeaderStatus').innerHTML = '💬 Active conversation';
        }
    });

    socket.on('message-sent', (msg) => {
        console.log('✅ Message sent confirmation:', msg);

        if (currentThreadId === msg.threadId && !displayedMessageIds.has(msg.id)) {
            displayedMessageIds.add(msg.id);
            addMessageToChat(msg);
            loadThreads();
        }
    });
}
            
            
            
            
        
        async function loadThreads() {
    try {
        console.log('🔄 Loading threads for all sites...');
        
        // নতুন API কল (সব সাইটের থ্রেড)
        const res = await fetch(`${API_URL}/threads/all`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        let threads = await res.json();
        
        const threadsList = document.getElementById('threadsList');
        const threadCount = document.getElementById('threadCount');
        
        threadCount.innerText = `${threads.length} threads`;
        
        if (threads.length === 0) {
            threadsList.innerHTML = `<div class="text-center py-8 text-gray-500"><i class="fas fa-inbox text-3xl mb-2"></i><p>No conversations yet</p></div>`;
            return;
        }
        
        // AUTO-JOIN all threads on load
        if (socket && socket.connected) {
            for (let thread of threads) {
                socket.emit('join-thread', thread.id, currentAgent?.id);
                console.log('✅ Auto-joined thread:', thread.id);
            }
        }
        
        // Get last message for each thread
        for (let thread of threads) {
            try {
                const msgRes = await fetch(`${API_URL}/threads/${thread.id}/messages`);
                const messages = await msgRes.json();
                if (messages.length > 0) {
                    const lastMsg = messages[messages.length - 1];
                    thread.lastMsg = lastMsg.message;
                    thread.lastMsgTime = lastMsg.createdAt;
                    thread.lastMsgId = lastMsg.id;
                } else {
                    thread.lastMsg = 'No messages';
                    thread.lastMsgTime = thread.lastMessageAt;
                    thread.lastMsgId = null;
                }
            } catch(e) {
                thread.lastMsg = 'Click to view';
                thread.lastMsgTime = thread.lastMessageAt;
                thread.lastMsgId = null;
            }
        }
        
        // Sort by last message time (newest first)
        threads.sort((a, b) => new Date(b.lastMsgTime) - new Date(a.lastMsgTime));
        
        let html = '';
        for (let thread of threads) {
            const isActive = currentThreadId === thread.id;
            const unreadCount = unreadCounts[thread.id] || 0;
            
            html += `
                <div id="thread-${thread.id}" class="thread-item p-3 rounded-xl ${isActive ? 'active' : 'hover:bg-gray-50'}" onclick="selectThread(${thread.id})">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <i class="fas fa-user-circle text-gray-400"></i>
                                <i class="fas fa-globe text-xs text-blue-500"></i>
                                <span class="font-semibold text-gray-800">${escapeHtml(thread.visitorName || 'Guest')}</span>
                                ${unreadCount > 0 ? `<span class="notification-badge">${unreadCount}</span>` : ''}
                            </div>
                            <p class="text-xs text-gray-500 mt-1">
                                <i class="fas fa-clock mr-1"></i>${new Date(thread.lastMsgTime).toLocaleString()}
                            </p>
                            <p class="text-sm text-gray-600 mt-1 truncate">
                                ${escapeHtml(thread.lastMsg.substring(0, 50))}
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }
        threadsList.innerHTML = html;
        
        console.log(`✅ Loaded ${threads.length} threads`);
        
    } catch (err) { 
        console.error('Load threads error:', err); 
    }
}
        
        async function selectThread(threadId) {
            currentThreadId = threadId;
            unreadCounts[threadId] = 0;
            localStorage.setItem('lastThreadId', threadId);
            
            document.getElementById('chatHeaderTitle').innerHTML = '<i class="fas fa-comment-dots mr-2"></i>Chatting with Visitor';
            document.getElementById('chatHeaderStatus').innerHTML = '💬 Active conversation';
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;
            setQuickRepliesDisabled(false);
            renderCustomQuickReplies();
            
            if (socket && socket.connected) {
                socket.emit('join-thread', threadId, currentAgent?.id);
                console.log('✅ Joined room: thread-' + threadId);
            }
            
            await loadMessages(threadId);
            loadThreads();
        }

        function insertQuickReply(replyText) {
            const messageInput = document.getElementById('messageInput');
            if (!messageInput || messageInput.disabled || !replyText) return;

            messageInput.value = replyText;
            messageInput.focus();
        }

        async function loadCustomQuickReplies() {
            if (!token) return;

            try {
                const res = await fetch(`${API_URL}/quick-replies`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Failed to load quick replies');

                customQuickReplyItems = await res.json();
                renderCustomQuickReplies();
                renderQuickReplySettings();
            } catch (err) {
                console.error('Load custom quick replies error:', err);
            }
        }

        function renderCustomQuickReplies() {
            const customQuickRepliesEl = document.getElementById('customQuickReplies');
            if (!customQuickRepliesEl) return;

            customQuickRepliesEl.innerHTML = customQuickReplyItems.map((reply) => `
                <button type="button" class="quick-reply-chip custom-quick-reply" data-reply="${escapeHtml(reply.text)}" data-tooltip="${escapeHtml(reply.text)}" onclick="insertQuickReply(this.dataset.reply)" ${currentThreadId ? '' : 'disabled'}>${escapeHtml(reply.text.substring(0, 24))}${reply.text.length > 24 ? '...' : ''}</button>
            `).join('');
        }

        function setupDelayedTooltips() {
            let tooltipTimer = null;
            let tooltipEl = null;

            document.addEventListener('mouseover', (event) => {
                const target = event.target.closest('[data-tooltip]');
                if (!target || target.disabled) return;

                clearTimeout(tooltipTimer);
                tooltipTimer = setTimeout(() => {
                    removeTooltip();

                    tooltipEl = document.createElement('div');
                    tooltipEl.className = 'quick-reply-tooltip';
                    tooltipEl.textContent = target.dataset.tooltip;
                    document.body.appendChild(tooltipEl);

                    const rect = target.getBoundingClientRect();
                    const tooltipRect = tooltipEl.getBoundingClientRect();
                    const left = Math.min(
                        Math.max(12, rect.left),
                        window.innerWidth - tooltipRect.width - 12
                    );
                    const top = Math.max(12, rect.top - tooltipRect.height - 8);

                    tooltipEl.style.left = `${left}px`;
                    tooltipEl.style.top = `${top}px`;
                }, 1000);
            });

            document.addEventListener('mouseout', (event) => {
                if (!event.target.closest('[data-tooltip]')) return;
                clearTimeout(tooltipTimer);
                removeTooltip();
            });

            function removeTooltip() {
                if (tooltipEl) {
                    tooltipEl.remove();
                    tooltipEl = null;
                }
            }
        }

        function renderQuickReplySettings() {
            const manager = document.getElementById('customQuickReplyManager');
            if (!manager) return;

            if (customQuickReplyItems.length === 0) {
                manager.innerHTML = '<p class="text-xs text-gray-500 text-center py-3">No custom replies yet.</p>';
                return;
            }

            manager.innerHTML = customQuickReplyItems.map((reply) => `
                <div class="rounded-lg border border-gray-200 p-2" id="quick-reply-row-${reply.id}">
                    <div class="flex items-center justify-between gap-3">
                        <p class="text-sm text-gray-700 truncate flex-1" title="${escapeHtml(reply.text)}">${escapeHtml(reply.text)}</p>
                        <div class="flex items-center gap-2">
                            <button type="button" class="text-gray-400 hover:text-teal-600" onclick="startEditQuickReply(${reply.id})" title="Edit quick reply">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button type="button" class="text-gray-400 hover:text-red-500" onclick="showDeleteQuickReplyConfirm(${reply.id})" title="Delete quick reply">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleQuickReplySettings(forceOpen) {
            const settings = document.getElementById('quickReplySettings');
            if (!settings) return;

            const shouldOpen = typeof forceOpen === 'boolean'
                ? forceOpen
                : settings.classList.contains('hidden');

            settings.classList.toggle('hidden', !shouldOpen);
            if (shouldOpen) renderQuickReplySettings();
        }

        async function addCustomQuickReply() {
            const input = document.getElementById('customQuickReplyInput');
            const trimmedReply = input?.value.trim();
            if (!trimmedReply) return;

            try {
                const res = await fetch(`${API_URL}/quick-replies`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text: trimmedReply })
                });

                if (!res.ok) throw new Error('Failed to save quick reply');

                const reply = await res.json();
                customQuickReplyItems.push(reply);
                input.value = '';
                renderCustomQuickReplies();
                renderQuickReplySettings();
            } catch (err) {
                console.error('Add custom quick reply error:', err);
                alert('Failed to save quick reply');
            }
        }

        function startEditQuickReply(replyId) {
            const reply = customQuickReplyItems.find(item => item.id === replyId);
            const row = document.getElementById(`quick-reply-row-${replyId}`);
            if (!reply || !row) return;

            row.innerHTML = `
                <div class="flex gap-2 items-start">
                    <textarea id="edit-quick-reply-${replyId}" rows="2" class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 resize-none">${escapeHtml(reply.text)}</textarea>
                    <button type="button" class="bg-teal-500 text-white rounded-lg px-3 py-2 text-sm hover:bg-teal-600" onclick="saveEditedQuickReply(${replyId})">
                        <i class="fas fa-check"></i>
                    </button>
                    <button type="button" class="bg-gray-100 text-gray-600 rounded-lg px-3 py-2 text-sm hover:bg-gray-200" onclick="renderQuickReplySettings()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            document.getElementById(`edit-quick-reply-${replyId}`)?.focus();
        }

        function showDeleteQuickReplyConfirm(replyId) {
            const row = document.getElementById(`quick-reply-row-${replyId}`);
            if (!row || row.querySelector('.quick-delete-confirm')) return;

            const confirmBox = document.createElement('div');
            confirmBox.className = 'quick-delete-confirm';
            confirmBox.innerHTML = `
                <p class="text-xs text-orange-800 mb-2">Delete this quick reply?</p>
                <div class="flex justify-end gap-2">
                    <button type="button" class="px-2 py-1 text-xs rounded bg-white border border-orange-200 text-gray-600 hover:bg-orange-50" onclick="renderQuickReplySettings()">Cancel</button>
                    <button type="button" class="px-2 py-1 text-xs rounded bg-red-500 text-white hover:bg-red-600" onclick="deleteCustomQuickReply(${replyId})">Delete</button>
                </div>
            `;
            row.appendChild(confirmBox);
        }

        async function saveEditedQuickReply(replyId) {
            const input = document.getElementById(`edit-quick-reply-${replyId}`);
            const trimmedReply = input?.value.trim();
            if (!trimmedReply) return;

            try {
                const res = await fetch(`${API_URL}/quick-replies/${replyId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ text: trimmedReply })
                });

                if (!res.ok) throw new Error('Failed to update quick reply');

                const updatedReply = await res.json();
                customQuickReplyItems = customQuickReplyItems.map(reply => reply.id === replyId ? updatedReply : reply);
                renderCustomQuickReplies();
                renderQuickReplySettings();
            } catch (err) {
                console.error('Update custom quick reply error:', err);
                alert('Failed to update quick reply');
            }
        }

        async function deleteCustomQuickReply(replyId) {
            try {
                const res = await fetch(`${API_URL}/quick-replies/${replyId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error('Failed to delete quick reply');

                customQuickReplyItems = customQuickReplyItems.filter(reply => reply.id !== replyId);
                renderCustomQuickReplies();
                renderQuickReplySettings();
            } catch (err) {
                console.error('Delete custom quick reply error:', err);
                alert('Failed to delete quick reply');
            }
        }

        function setQuickRepliesDisabled(isDisabled) {
            document.querySelectorAll('#quickReplies button[data-reply], #customQuickReplies button[data-reply]').forEach(button => {
                button.disabled = isDisabled;
            });
        }
        
        async function loadMessages(threadId) {
            try {
                const res = await fetch(`${API_URL}/threads/${threadId}/messages`);
                const messages = await res.json();
                
                const chatMessages = document.getElementById('chatMessages');
                chatMessages.innerHTML = '';
                displayedMessageIds.clear();
                
                if (messages.length === 0) {
                    chatMessages.innerHTML = `<div class="text-center py-8 text-gray-400"><i class="fas fa-comment text-4xl mb-2"></i><p>No messages yet</p></div>`;
                } else {
                    messages.forEach(msg => {
                        displayedMessageIds.add(msg.id);
                        addMessageToChat(msg);
                    });
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } catch (err) { 
                console.error('Load messages error:', err); 
            }
        }
        
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            if (!message || !currentThreadId || !socket) return;
            
            socket.emit('support-message', {
                threadId: currentThreadId,
                message: message,
                supportId: currentAgent?.id
            });
            
            messageInput.value = '';
        }
        
        function addMessageToChat(msg) {
            const chatMessages = document.getElementById('chatMessages');
            const isSentByMe = msg.sender === 'support';
            
            if (document.getElementById(`msg-${msg.id}`)) return;
            
            const messageDiv = document.createElement('div');
            messageDiv.id = `msg-${msg.id}`;
            messageDiv.className = `flex ${isSentByMe ? 'justify-end' : 'justify-start'} fade-in`;
            messageDiv.innerHTML = `
                <div class="max-w-[70%] ${isSentByMe ? 'message-sent' : 'message-received'} p-3">
                    <div class="text-sm">${escapeHtml(msg.message)}</div>
                    <div class="text-xs mt-1 opacity-70 ${isSentByMe ? 'text-white/80' : 'text-gray-500'}">
                        ${new Date(msg.createdAt).toLocaleTimeString()}
                    </div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function setupTypingListener() {
            const messageInput = document.getElementById('messageInput');
            if (!messageInput) return;
            
            messageInput.addEventListener('input', () => {
                if (socket && currentThreadId) {
                    socket.emit('support-typing', { threadId: currentThreadId, isTyping: true });
                    clearTimeout(typingTimeout);
                    typingTimeout = setTimeout(() => {
                        if (socket) socket.emit('support-typing', { threadId: currentThreadId, isTyping: false });
                    }, 1000);
                }
            });
        }
        
        function playNotificationSound() {
            try {
                const audio = new Audio('data:audio/wav;base64,U3RlYWx0aCBzb3VuZA==');
                audio.play().catch(e => console.log('Sound not supported'));
            } catch(e) {}
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function logout() {
            localStorage.removeItem('supportToken');
            localStorage.removeItem('agentName');
            if (socket) socket.disconnect();
            window.location.href = '/support-panel';
        }
        
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && document.getElementById('messageInput') === document.activeElement) {
                sendMessage();
            }
        });
        
        setTimeout(() => setupTypingListener(), 1000);
    </script>
</body>
</html>
