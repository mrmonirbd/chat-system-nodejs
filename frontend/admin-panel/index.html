<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Chat Support System</title>
    
    <!-- Tailwind CSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #5a67d8;
        }
        
        /* Card Hover Effect */
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
        
        /* Fade In Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        /* Loading Spinner */
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <div class="fade-in">
            <div class="flex justify-between items-center mb-8 bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-xl">
                <div>
                    <h1 class="text-3xl font-bold text-white">
                        <i class="fas fa-comments mr-3"></i>Chat Support System
                    </h1>
                    <p class="text-white/80 mt-2">Manage sites, support agents, and monitor all chats</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-white text-right">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-user-circle text-2xl"></i>
                            <span id="adminName" class="font-semibold">Admin</span>
                        </div>
                        <button onclick="logout()" class="text-sm text-white/80 hover:text-white mt-1 transition">
                            <i class="fas fa-sign-out-alt mr-1"></i>Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 fade-in">
            <div class="bg-white rounded-2xl shadow-xl p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Total Sites</p>
                        <p class="text-3xl font-bold text-gray-800 mt-2" id="totalSites">0</p>
                    </div>
                    <div class="bg-blue-100 rounded-full p-3">
                        <i class="fas fa-globe text-blue-600 text-2xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-xl p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Support Agents</p>
                        <p class="text-3xl font-bold text-gray-800 mt-2" id="totalAgents">0</p>
                    </div>
                    <div class="bg-green-100 rounded-full p-3">
                        <i class="fas fa-headset text-green-600 text-2xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-xl p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Active Chats</p>
                        <p class="text-3xl font-bold text-gray-800 mt-2" id="activeChats">0</p>
                    </div>
                    <div class="bg-yellow-100 rounded-full p-3">
                        <i class="fas fa-comment-dots text-yellow-600 text-2xl"></i>
                    </div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-xl p-6 card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">Total Messages</p>
                        <p class="text-3xl font-bold text-gray-800 mt-2" id="totalMessages">0</p>
                    </div>
                    <div class="bg-purple-100 rounded-full p-3">
                        <i class="fas fa-envelope text-purple-600 text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8 fade-in">
            <!-- Create Site Card -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-4">
                    <h2 class="text-xl font-bold text-white">
                        <i class="fas fa-plus-circle mr-2"></i>Create New Site
                    </h2>
                </div>
                <div class="p-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">
                                <i class="fas fa-building mr-2 text-gray-400"></i>Site Name
                            </label>
                            <input type="text" id="siteName" placeholder="e.g., My Awesome Website" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">
                                <i class="fas fa-link mr-2 text-gray-400"></i>Domain
                            </label>
                            <input type="text" id="siteDomain" placeholder="e.g., example.com" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                        </div>
                        <button onclick="createSite()" 
                                class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold py-3 rounded-xl hover:shadow-lg transition-all duration-300 transform hover:scale-105">
                            <i class="fas fa-check-circle mr-2"></i>Create Site
                        </button>
                    </div>
                </div>
            </div>

            <!-- Add Support Agent Card -->
            <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                <div class="bg-gradient-to-r from-green-500 to-green-600 px-6 py-4">
                    <h2 class="text-xl font-bold text-white">
                        <i class="fas fa-user-plus mr-2"></i>Add Support Agent
                    </h2>
                </div>
                <div class="p-6">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">
                                <i class="fas fa-globe mr-2 text-gray-400"></i>Select Site
                            </label>
                            <select id="siteSelect" 
                                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
                                <option value="">Choose a site...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">
                                <i class="fas fa-user mr-2 text-gray-400"></i>Full Name
                            </label>
                            <input type="text" id="supportName" placeholder="e.g., John Doe" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">
                                <i class="fas fa-envelope mr-2 text-gray-400"></i>Email Address
                            </label>
                            <input type="email" id="supportEmail" placeholder="e.g., john@example.com" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-medium mb-2">
                                <i class="fas fa-lock mr-2 text-gray-400"></i>Password
                            </label>
                            <input type="password" id="supportPassword" placeholder="••••••••" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent">
                        </div>
                        <button onclick="addSupport()" 
                                class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white font-semibold py-3 rounded-xl hover:shadow-lg transition-all duration-300 transform hover:scale-105">
                            <i class="fas fa-user-check mr-2"></i>Add Support Agent
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sites List Section -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden fade-in">
            <div class="bg-gradient-to-r from-purple-500 to-pink-500 px-6 py-4">
                <h2 class="text-xl font-bold text-white">
                    <i class="fas fa-list mr-2"></i>Your Websites & Integration
                </h2>
            </div>
            <div class="p-6">
                <div id="sitesList" class="grid grid-cols-1 gap-6">
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-spinner fa-spin text-3xl mb-2"></i>
                        <p>Loading sites...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const API_URL = 'http://localhost:3000/api';
    let token = localStorage.getItem('token');
    
    // SweetAlert2 Helpers
    const showError = (message) => {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: message,
            position: 'top-right',
            toast: true,
            timer: 5000,
            timerProgressBar: true,
            showConfirmButton: false
        });
    };
    
    const showSuccess = (title, text = '') => {
        Swal.fire({
            icon: 'success',
            title: title,
            text: text,
            position: 'top-right',
            toast: true,
            timer: 3000,
            timerProgressBar: true,
            showConfirmButton: false
        });
    };
    
    const showWarning = (message) => {
        Swal.fire({
            icon: 'warning',
            title: 'Warning',
            text: message,
            position: 'top-right',
            toast: true,
            timer: 4000,
            timerProgressBar: true,
            showConfirmButton: false
        });
    };
    
    // Check authentication
    if (!token) {
        showLoginModal();
    } else {
        verifyTokenAndLoad();
    }
    
    function showLoginModal() {
        Swal.fire({
            title: 'Admin Login',
            html: `
                <input type="email" id="loginEmail" class="swal2-input" placeholder="Admin Email" value="admin@example.com">
                <input type="password" id="loginPassword" class="swal2-input" placeholder="Password" value="admin123">
            `,
            allowOutsideClick: false,
            didOpen: (modal) => {
                document.getElementById('loginEmail').focus();
            },
            preConfirm: () => {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                if (!email || !password) {
                    Swal.showValidationMessage('Please enter email and password');
                    return false;
                }
                return { email, password };
            }
        }).then(result => {
            if (result.isConfirmed) {
                const { email, password } = result.value;
                fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('adminName', data.user.name);
                        token = data.token;
                        document.getElementById('adminName').innerText = data.user.name;
                        loadDashboard();
                    } else {
                        showError('Login failed! Please check your credentials.');
                        showLoginModal();
                    }
                })
                .catch(() => {
                    showError('Network error! Please try again.');
                    showLoginModal();
                });
            }
        });
    }
    
    async function verifyTokenAndLoad() {
    try {
        const res = await fetch(`${API_URL}/sites/list`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        
        if (res.status === 401) {
            localStorage.removeItem('token');
            showLoginModal();
        } else {
            const adminName = localStorage.getItem('adminName') || 'Admin';
            document.getElementById('adminName').innerText = adminName;
            
            // Socket.IO শুরু করুন
            initAdminSocket();
            
            loadDashboard();
            
            setInterval(() => {
                loadStats();
                loadSites();
            }, 30000);
        }
    } catch (err) {
        console.error('Token verification failed:', err);
        showLoginModal();
    }
}
    
    async function loadDashboard() {
        await Promise.all([
            loadSites(),
            loadStats()
        ]);
    }
    
    async function createSite() {
        const name = document.getElementById('siteName').value;
        const domain = document.getElementById('siteDomain').value;
        
        if (!name || !domain) {
            showWarning('Please fill both Site Name and Domain!');
            return;
        }
        
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Creating...';
        btn.disabled = true;
        
        try {
            const res = await fetch(`${API_URL}/sites/create`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ name, domain })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Success!',
                    html: `Site "<strong>${escapeHtml(name)}</strong>" created successfully!<br><br>🔑 <strong>API Key:</strong><br><code style="background: #f0f0f0; padding: 10px; border-radius: 5px; display: block; margin-top: 10px; word-break: break-all;">${data.apiKey}</code><br><br><small>Save this key to embed chat widget on your website.</small>`,
                    allowOutsideClick: false
                });
                document.getElementById('siteName').value = '';
                document.getElementById('siteDomain').value = '';
                loadSites();
                loadStats();
            } else {
                showError(data.error || 'Failed to create site');
            }
        } catch (err) {
            showError('Network error: ' + err.message);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
    
    async function addSupport() {
        const siteId = document.getElementById('siteSelect').value;
        const name = document.getElementById('supportName').value;
        const email = document.getElementById('supportEmail').value;
        const password = document.getElementById('supportPassword').value;
        
        if (!siteId || !name || !email || !password) {
            showWarning('Please fill all fields!');
            return;
        }
        
        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Adding...';
        btn.disabled = true;
        
        try {
            const res = await fetch(`${API_URL}/sites/add-support`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ siteId, name, email, password })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                showSuccess('Support agent added!', `${name} (${email}) added successfully!`);
                document.getElementById('supportName').value = '';
                document.getElementById('supportEmail').value = '';
                document.getElementById('supportPassword').value = '';
                loadStats();
            } else {
                showError(data.error || 'Failed to add support agent');
            }
        } catch (err) {
            showError('Network error: ' + err.message);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }
    
    async function loadSites() {
        try {
            const res = await fetch(`${API_URL}/sites/list`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const sites = await res.json();
            
            const siteSelect = document.getElementById('siteSelect');
            const sitesList = document.getElementById('sitesList');
            
            siteSelect.innerHTML = '<option value="">🌐 Choose a site...</option>';
            
            if (sites.length === 0) {
                sitesList.innerHTML = `
                    <div class="text-center py-12 bg-gray-50 rounded-xl">
                        <i class="fas fa-folder-open text-5xl text-gray-300 mb-3"></i>
                        <p class="text-gray-500">No sites created yet. Create your first site above!</p>
                    </div>
                `;
                return;
            }
            
            sitesList.innerHTML = '';
            
            sites.forEach(site => {
                siteSelect.innerHTML += `<option value="${site.id}">🏢 ${site.name} (${site.domain})</option>`;
                
                sitesList.innerHTML += `
                    <div class="border border-gray-200 rounded-xl p-5 hover:shadow-lg transition-all duration-300">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="text-lg font-bold text-gray-800">
                                    <i class="fas fa-globe text-blue-500 mr-2"></i>${escapeHtml(site.name)}
                                </h3>
                                <p class="text-gray-500 text-sm mt-1">
                                    <i class="fas fa-link mr-1"></i>${escapeHtml(site.domain)}
                                </p>
                            </div>
                            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-semibold">
                                <i class="fas fa-check-circle mr-1"></i>Active
                            </span>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-3 mt-3">
                            <p class="text-xs text-gray-500 mb-1">
                                <i class="fas fa-key mr-1"></i>API Key:
                            </p>
                            <code class="text-sm bg-white px-2 py-1 rounded border break-all block font-mono">${site.apiKey}</code>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-3 mt-3">
                            <p class="text-xs text-gray-500 mb-2">
                                <i class="fas fa-palette mr-1"></i>Widget UI:
                            </p>
                            <div class="grid grid-cols-1 md:grid-cols-[auto_1fr_auto] gap-2 items-start">
                                <input type="color" id="widgetColor-${site.id}" value="${site.widgetColor || '#3B82F6'}" class="w-12 h-10 rounded border border-gray-300 bg-white cursor-pointer">
                                <textarea id="greetingMessage-${site.id}" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Greeting message">${escapeHtml(site.greetingMessage || 'Hello! How can we help you?')}</textarea>
                                <button onclick="saveWidgetSettings(${site.id})" class="bg-teal-500 text-white px-3 py-2 rounded text-sm hover:bg-teal-600 transition">
                                    <i class="fas fa-save mr-1"></i>Save
                                </button>
                            </div>
                        </div>
                        <div class="bg-gray-50 rounded-lg p-3 mt-3">
                            <p class="text-xs text-gray-500 mb-1">
                                <i class="fas fa-code mr-1"></i>Integration Code:
                            </p>
                            <code class="text-sm bg-white px-2 py-1 rounded border break-all block font-mono" style="font-size: 11px;">
                                &lt;script src="http://localhost:3000/widget.js" data-chat-widget data-api-key="${site.apiKey}"&gt;&lt;/script&gt;
                            </code>
                            <button onclick="copyToClipboard('${site.apiKey}')" 
                                    class="mt-2 text-xs bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 transition">
                                <i class="fas fa-copy mr-1"></i>Copy Code
                            </button>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            console.error('Load sites error:', err);
            document.getElementById('sitesList').innerHTML = `
                <div class="text-center py-12 text-red-500">
                    <i class="fas fa-exclamation-triangle text-3xl mb-2"></i>
                    <p>Failed to load sites. Please refresh the page.</p>
                </div>
            `;
        }
    }
    
    async function loadStats() {
        try {
            // Load sites count
            const sitesRes = await fetch(`${API_URL}/sites/list`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const sites = await sitesRes.json();
            document.getElementById('totalSites').innerText = sites.length;
            
            // Load support agents count
            try {
                const agentsRes = await fetch(`${API_URL}/support-agents/count`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (agentsRes.ok) {
                    const agentsData = await agentsRes.json();
                    document.getElementById('totalAgents').innerText = agentsData.count;
                } else {
                    let totalAgents = 0;
                    for (const site of sites) {
                        try {
                            const siteAgentsRes = await fetch(`${API_URL}/sites/${site.id}/support-agents`, {
                                headers: { 'Authorization': `Bearer ${token}` }
                            });
                            if (siteAgentsRes.ok) {
                                const agents = await siteAgentsRes.json();
                                totalAgents += agents.length;
                            }
                        } catch (err) {}
                    }
                    document.getElementById('totalAgents').innerText = totalAgents;
                }
            } catch (err) {
                document.getElementById('totalAgents').innerText = '0';
            }
            
            // ========== ACTIVE CHATS COUNT ==========
            try {
                let totalActiveChats = 0;
                for (const site of sites) {
                    try {
                        const threadsRes = await fetch(`${API_URL}/threads/site/${site.id}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (threadsRes.ok) {
                            const threads = await threadsRes.json();
                            const activeCount = threads.filter(t => t.status === 'open' || t.status === 'pending').length;
                            totalActiveChats += activeCount;
                        }
                    } catch (err) {}
                }
                document.getElementById('activeChats').innerText = totalActiveChats;
            } catch (err) {
                document.getElementById('activeChats').innerText = '0';
            }
            
            // ========== TOTAL MESSAGES COUNT ==========
            try {
                let totalMessages = 0;
                for (const site of sites) {
                    try {
                        const threadsRes = await fetch(`${API_URL}/threads/site/${site.id}`, {
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        if (threadsRes.ok) {
                            const threads = await threadsRes.json();
                            for (const thread of threads) {
                                try {
                                    const msgRes = await fetch(`${API_URL}/threads/${thread.id}/messages`);
                                    if (msgRes.ok) {
                                        const messages = await msgRes.json();
                                        totalMessages += messages.length;
                                    }
                                } catch (err) {}
                            }
                        }
                    } catch (err) {}
                }
                document.getElementById('totalMessages').innerText = totalMessages;
            } catch (err) {
                document.getElementById('totalMessages').innerText = '0';
            }
            
        } catch (err) {
            console.error('Load stats error:', err);
            document.getElementById('totalSites').innerText = '0';
            document.getElementById('totalAgents').innerText = '0';
            document.getElementById('activeChats').innerText = '0';
            document.getElementById('totalMessages').innerText = '0';
        }
    }
    
    function copyToClipboard(apiKey) {
        const code = `<script src="http://localhost:3000/widget.js" data-chat-widget data-api-key="${apiKey}"><\/script>`;
        navigator.clipboard.writeText(code);
        showSuccess('Copied!', 'Integration code copied to clipboard');
    }

    async function saveWidgetSettings(siteId) {
        const widgetColor = document.getElementById(`widgetColor-${siteId}`).value;
        const greetingMessage = document.getElementById(`greetingMessage-${siteId}`).value;

        try {
            const res = await fetch(`${API_URL}/sites/${siteId}/widget-settings`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ widgetColor, greetingMessage })
            });

            const data = await res.json();

            if (res.ok) {
                showSuccess('Saved!', 'Widget UI settings updated.');
                loadSites();
            } else {
                showError(data.error || 'Failed to save widget settings');
            }
        } catch (err) {
            showError('Network error: ' + err.message);
        }
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('adminName');
        window.location.href = '/login';
    }

    let adminSocket = null;

function initAdminSocket() {
    adminSocket = io('http://localhost:3000');
    
    adminSocket.on('connect', () => {
        console.log('✅ Admin socket connected');
        adminSocket.emit('admin-auth', token);
    });
    
    // লাইভ আপডেটের জন্য লিসেনার
    adminSocket.on('new-message', () => {
        console.log('📨 Admin: New message received, updating stats');
        loadStats();  // স্ট্যাটস রিফ্রেশ
    });
    
    adminSocket.on('new-thread', () => {
        console.log('🆕 Admin: New thread created');
        loadStats();
        loadSites();
    });
    
    adminSocket.on('connect_error', (err) => {
        console.error('Admin socket error:', err);
    });
}
</script>
</body>
</html>
